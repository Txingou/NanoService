name: publish-nuget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-pack-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NanoService.slnx

      - name: Test
        run: dotnet test tests/NanoService.Tests -c Release --no-restore

      - name: Pack NanoTransport
        run: dotnet pack src/NanoTransport -c Release -o artifacts/packages --no-restore

      - name: Pack NanoService
        run: dotnet pack src/NanoService -c Release -o artifacts/packages --no-restore

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER || 'Mr.Ming' }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push artifacts/packages/*.nupkg \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
